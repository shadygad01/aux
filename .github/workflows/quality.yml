name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project quality tools
        run: python -m pip install --disable-pip-version-check -e ".[quality]"
      - name: Formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Architecture, tests, and coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
